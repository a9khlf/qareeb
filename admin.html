<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Qareeb Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<style>
  .login{max-width:400px;margin:48px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
  .login h1{margin:0 0 4px;font-size:22px}
  .login p{margin:0 0 16px;color:var(--muted)}
  .fld{display:grid;gap:4px;margin-bottom:12px}
  .fld>span,.fld>label{font-size:13px;font-weight:600}
  .fld input,.fld select,.fld textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
  .fld textarea{min-height:84px;resize:vertical}
  .help{font-size:12.5px;color:var(--muted);margin:0}
  .loginlinks{display:grid;gap:6px;margin-top:14px;justify-items:start}
  .fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
  .fchip{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .fchip b{margin-inline-start:4px;color:var(--muted)}
  .fchip.on{background:var(--brand);border-color:var(--brand);color:#fff} .fchip.on b{color:#fff}
  .chip.st-new{background:#fbe7d7;color:#8f3f12} .chip.st-contacted{background:#e3f0f2;color:var(--brand-d)} .chip.st-viewing{background:#efe8d3;color:#6b5314}
  .chip.st-reserved{background:#e6e1f3;color:#47337a} .chip.st-rented{background:#dff1e8;color:var(--ok)} .chip.st-lost{background:#ececec;color:#555}
  .item.lead a{color:var(--brand)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px}
  .tile{display:grid;gap:2px;text-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;cursor:pointer;color:var(--ink)}
  .tile b{font-size:30px;line-height:1.1} .tile span{font-size:13.5px;color:var(--muted)}
  .tile.hot{border-color:#b4531a;background:#fdf3ea} .tile.hot b{color:#8f3f12}
  .todo{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)} .todo:last-child{border-bottom:0}
  .bar-row{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;padding:4px 0;font-size:14px}
  .bar-row i{display:block;height:10px;border-radius:6px;background:var(--brand)} .bar-row b{text-align:end}
  .spark{display:flex;gap:10px;align-items:flex-end;min-height:100px;padding-top:6px}
  .spark div{flex:1;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted)} .spark i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--brand)} .spark b{color:var(--ink)}
  .notes{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .note{padding:6px 0;border-bottom:1px solid #f0ece2} .note.sys{color:var(--muted);font-size:13.5px}
  .linkbtn{background:none;border:0;padding:4px 0;font:inherit;font-size:14px;color:var(--brand);text-decoration:underline;cursor:pointer}
  .linkbtn[hidden],.tab[hidden],#addBtn[hidden],#logout[hidden]{display:none}
  .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .btn.sec{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .btn.sec:hover{background:var(--brand-soft)}
  .btn.danger{background:var(--bad)} .btn.danger:hover{background:#6e1429}
  .btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
  .tabs{display:flex;gap:8px;margin:20px 0 14px;flex-wrap:wrap;align-items:center}
  .tab{border:1px solid var(--line);background:#fff;padding:8px 18px;border-radius:999px;font:inherit;cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs .grow{margin-inline-start:auto}
  .item{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .item .thumb{flex:0 0 84px;height:64px;border-radius:10px;background-size:cover;background-position:center;display:grid;place-items:center;font-size:26px}
  .item .main{flex:1;min-width:0}
  .item h3{margin:0 0 2px;font-size:16px}
  .item .meta2{color:var(--muted);font-size:13.5px}
  .item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .item .acts select{width:auto;padding:6px 8px;border:1px solid var(--line)}
  .chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#eeeae0;margin-inline-end:4px}
  .chip.ok{background:#dff1e8;color:var(--ok)} .chip.off{background:#f3dde3;color:var(--bad)}
  .msg{position:sticky;top:60px;z-index:15;margin:10px 0;padding:10px 14px;border-radius:10px;background:#e3f0f2;color:var(--brand-d);display:none}
  .msg.err{background:#f8eeeb;color:var(--bad)}
  dialog{border:0;border-radius:16px;padding:0;width:calc(100% - 24px);max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  dialog::backdrop{background:rgba(10,20,18,.55)}
  .dform{padding:18px;max-height:88vh;overflow:auto}
  .dform h2{margin:0 0 12px}
  .dform fieldset{border:1px solid var(--line);border-radius:12px;margin:0 0 14px;padding:12px 12px 2px}
  .dform legend{font-weight:700;padding:0 6px}
  .chk{display:flex;gap:8px;align-items:center;margin:0 0 10px}
  .chk input{width:auto}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
  .thumbs .t{position:relative;width:96px;height:72px;border-radius:8px;background-size:cover;background-position:center;border:1px solid var(--line)}
  .thumbs .t button{position:absolute;top:2px;inset-inline-end:2px;border:0;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
  .thumbs .t i{position:absolute;bottom:2px;inset-inline-start:2px;background:var(--brand);color:#fff;font-size:11px;font-style:normal;padding:1px 6px;border-radius:6px}
  .foot2{display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:-18px;background:#fff;padding:12px 0 6px}
  .count-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  @media(max-width:560px){.item{flex-direction:column}.item .thumb{width:100%;flex-basis:auto;height:120px}}
  /* workspace: dark side drawer + top bar + content */
  body.inapp .top,body.inapp #loginMain{display:none}
  .msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:90;width:max-content;max-width:min(640px,92vw);margin:0;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
  .drawer{position:sticky;top:0;height:100vh;overflow:auto;background:var(--midnight);color:#cfe3e7;display:flex;flex-direction:column;padding:18px 14px 14px}
  .drawerclose{display:none;position:absolute;top:10px;inset-inline-end:10px;border:0;background:rgba(255,255,255,.1);color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer}
  .usercard{display:flex;gap:12px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  .avatar{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:#c9a24a;color:var(--midnight);display:grid;place-items:center;font-weight:800;font-size:18px}
  .usercard b{display:block;color:#fff;font-size:15px;line-height:1.25} .usercard small{color:#9dbcc3;font-size:12.5px}
  .navgroup{margin-top:16px}
  .navhead{margin:0 10px 6px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#7ea3ab;font-weight:700}
  .drawer .tab{display:flex;width:100%;align-items:center;border:0;background:transparent;color:#d6e7ea;border-radius:10px;text-align:start;padding:10px 12px;font:inherit;font-weight:600;cursor:pointer}
  .drawer .tab:hover{background:rgba(255,255,255,.08)}
  .drawer .tab.on{background:#0e6f82;color:#fff;box-shadow:inset 3px 0 0 #c9a24a}
  .drawer .tab[hidden],.navgroup[hidden]{display:none}
  .sidelink{display:block;margin:14px 6px 0;padding:10px 6px;font-size:14px;color:#9fd0d9;border-top:1px solid rgba(255,255,255,.12)}
  .drawerlogo{margin-top:auto;padding-top:16px}
  .drawerlogo div{background:#fff;border-radius:12px;padding:10px 14px;text-align:center}
  .drawerlogo img{height:30px;width:auto;max-width:100%}
  .appmain{min-width:0}
  .topbar{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;padding:12px 24px;background:rgba(250,248,243,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .searchbox{flex:1;max-width:580px}
  .searchbox input{width:100%;height:42px;padding:0 16px;border:1px solid var(--line);border-radius:999px;font:inherit;background:#fff;color:var(--ink)}
  .iconbtn{height:42px;min-width:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
  .iconbtn:hover{background:var(--brand-soft)}
  .iconbtn.menu{display:none;background:var(--midnight);color:#fff;border-color:var(--midnight);font-size:18px}
  .content{padding:24px 24px 64px;max-width:1120px}
  .contenthead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;min-height:40px}
  .contenthead h1{margin:0;font-size:clamp(24px,3vw,32px);letter-spacing:-.015em}
  #addBtn[hidden]{display:none}
  .scrim{position:fixed;inset:0;background:rgba(5,20,25,.55);z-index:40}
  .scrim[hidden]{display:none}
  .subtabs{display:flex;gap:8px;overflow-x:auto;padding:6px;margin:0 0 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
  .subtab{flex:0 0 auto;border:0;background:transparent;padding:9px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
  .subtab.on{background:var(--midnight);color:#fff}
  .subtext{margin:-8px 0 16px;color:var(--muted)}
  .doitem{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:8px;font:inherit;cursor:pointer;color:var(--ink)}
  .doitem:hover{border-color:var(--brand)}
  .doitem small{color:var(--muted);white-space:nowrap}
  .dohead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
  .dohead h3{margin:0;font-size:16px} .dohead .n{display:inline-block;margin-inline-start:8px;min-width:26px;text-align:center;padding:1px 8px;border-radius:999px;background:#fbe7d7;color:#8f3f12;font-size:13px;font-weight:700}
  .dohead a,.dohead button{background:none;border:0;color:var(--brand);font:inherit;font-size:14px;cursor:pointer;padding:0}
  .banner{display:grid;gap:6px;background:#fff8e8;border:1px solid #e6cf94;border-inline-start:5px solid #c9a24a;border-radius:14px;padding:14px 16px;margin:0 0 12px}
  .banner h3{margin:0;font-size:16px} .banner .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#8a6a14}
  .banner .tag{justify-self:start;background:none;padding:0}
  .banner p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .banner .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .news{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 8px}
  .receipts{font-size:13.5px;color:var(--muted);margin-top:6px}
  .receipts b{color:var(--ink)}
  .rank{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)} .rank:last-child{border-bottom:0}
  .rank .pos{width:28px;height:28px;border-radius:50%;background:var(--midnight);color:#e6cf94;display:grid;place-items:center;font-weight:700;font-size:13px}
  .rank small{display:block;color:var(--muted)}
  @media(max-width:900px){
    .app{grid-template-columns:minmax(0,1fr)}
    .drawer{position:fixed;inset:0 auto 0 0;width:292px;max-width:88vw;z-index:50;transform:translateX(-104%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.4)}
    .drawer.open{transform:none}
    .drawerclose{display:block}
    .iconbtn.menu{display:inline-flex;align-items:center}
    .topbar{padding:10px 14px}
    .content{padding:18px 14px 64px}
  }
  /* student site page */
  .sharecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .sharecard h2{margin:0 0 4px;font-size:18px}
  .linkrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .linkrow input{flex:1;min-width:220px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#faf8f3;color:var(--ink)}
  .qrbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .qrbox .qr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;line-height:0}
  .qrbox .qr svg{width:160px;height:160px}
  .centerlink{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line)}
  .centerlink:last-child{border-bottom:0}
  .centerlink span{min-width:0;flex:1}
  .btn.wa{background:#1d6f42} .btn.wa:hover{background:#155534}
  .lgroup{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;background:#fcfbf8}
  .lg-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
  .lg-head small{color:var(--muted)}
  .lg-btns{display:flex;flex-wrap:wrap;gap:10px 18px}
  .lg-v{display:inline-flex;align-items:center;gap:4px}
  .lgbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
  .lgbtn i{font-style:normal;font-weight:500;color:var(--muted);font-size:12px;margin-inline-start:4px}
  .lgbtn:hover{border-color:var(--brand)}
  .lgic{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--brand);text-decoration:none}
  .lgic.wa{background:#e5f4ec;color:#1d6f42;border-color:#bfe0cd}
  .lgic:hover{border-color:var(--brand)}
  table.lt{width:100%;border-collapse:collapse;margin-top:10px;font-size:14.5px}
  table.lt th{text-align:start;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.lt td{padding:10px;border-bottom:1px dashed var(--line);vertical-align:top}
  table.lt tr.off td{opacity:.55}
  .linkform{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .linkform h3{margin:0 0 10px;font-size:16px}
  .linkrow .btn,.centerlink .btn{display:inline-block;width:auto;flex:0 0 auto;text-align:center;box-shadow:none}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <span class="logo"><img class="logo-full" src="logo-header.png" alt="Qareeb" width="394" height="132"><span class="adm">Staff</span></span>
  </div>
</header>

<div id="msg" class="msg" role="status" aria-live="polite"></div>

<main class="wrap" id="loginMain">
  <section id="loginBox" class="login">
    <h1 id="loginH">Staff sign-in</h1>
    <p id="loginP">Use the email and password the owner gave you.</p>
    <form id="loginForm">
      <div class="fld" id="emailRow"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"></div>
      <div class="fld" id="pwRow"><label for="pw" id="pwLabel">Password</label><input id="pw" type="password" required autocomplete="current-password"></div>
      <button class="btn" id="loginBtn" type="submit" style="width:100%">Log in</button>
    </form>
    <div class="loginlinks">
      <button type="button" class="linkbtn" id="toSignup" hidden>Create your account</button>
      <button type="button" class="linkbtn" id="toForgot">Forgot password?</button>
      <button type="button" class="linkbtn" id="toLogin" hidden>Back to sign-in</button>
    </div>
  </section>
</main>

<div id="panel" class="app" hidden>
  <aside class="drawer" id="drawer" aria-label="Staff menu">
    <button class="drawerclose" id="drawerClose" type="button" aria-label="Close menu">✕</button>
    <div class="usercard"><span class="avatar" id="uAvatar">Q</span><span><b id="uName"></b><small id="uRole"></small></span></div>
    <nav>
      <div class="navgroup"><p class="navhead">Today</p>
        <button class="tab on" data-tab="home" type="button">Overview</button>
      </div>
      <div class="navgroup"><p class="navhead">Sales</p>
        <button class="tab" data-tab="requests" type="button">Leads</button>
        <button class="tab" data-tab="rooms" type="button">Rooms</button>
        <button class="tab" data-tab="owners" type="button">Owners</button>
        <button class="tab" data-tab="share" type="button">Student page (share)</button>
      </div>
      <div class="navgroup"><p class="navhead">Website</p>
        <button class="tab" data-tab="site" type="button">Edit website</button>
        <button class="tab" data-tab="centers" type="button">Language centers</button>
        <button class="tab" data-tab="suggest" type="button">Center suggestions</button>
      </div>
      <div class="navgroup"><p class="navhead">Team</p>
        <button class="tab" data-tab="news" type="button">Announcements</button>
        <button class="tab" data-tab="staff" type="button">Team</button>
        <button class="tab" data-tab="history" type="button">Audit log</button>
      </div>
    </nav>
    <a class="sidelink" href="./" target="_blank" rel="noopener">View the student site ↗</a>
    <div class="drawerlogo"><div><img src="logo-header.png" alt="Qareeb" width="394" height="132"></div></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="appmain">
    <div class="topbar">
      <button id="menuBtn2" class="iconbtn menu" type="button" aria-label="Open menu">☰</button>
      <div class="searchbox"><input id="gsearch" type="search" placeholder="Search leads, rooms, owners" autocomplete="off" aria-label="Search"></div>
      <button id="refreshBtn" class="iconbtn" type="button" aria-label="Refresh" title="Refresh">↻</button>
      <button id="logout" class="iconbtn" type="button">Log out</button>
    </div>
    <div class="content">
      <div id="banners"></div>
      <div class="contenthead"><h1 id="pageTitle">Overview</h1><button id="addBtn" class="btn sm" type="button">+ Add room</button></div>
      <div id="list"></div>
    </div>
  </div>
</div>

<dialog id="dlg"><div id="dform" class="dform"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="amenities.js"></script>
<script src="sitetext.js"></script>
<script src="admin.js"></script>
</body>
</html>
